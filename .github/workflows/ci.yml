name: FinSight CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: finsight-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5433"
  POSTGRES_DB: finsight_db
  POSTGRES_USER: finsight_user
  POSTGRES_PASSWORD: finsight_password
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  validate-and-test:
    name: Validate, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: finsight_db
          POSTGRES_USER: finsight_user
          POSTGRES_PASSWORD: finsight_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U finsight_user -d finsight_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

- name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

- name: Install dependencies
        run: |
          python -m pip install --upgrade pip

if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

python -m pip install \
            pydantic \
            psycopg2-binary \
            great-expectations \
            pytest \
            pytest-cov \
            ruff

- name: Verify dependencies
        run: |
          python --version
          pip check

- name: Check Python syntax
        run: |
          python -m compileall -q src data

- name: Run Ruff linter
        run: |
          ruff check .

- name: Check code formatting
        run: |
          ruff format --check .

- name: Wait for PostgreSQL
        run: |
          for attempt in {1..30}; do
            python - <<'PY'
          import os
          import psycopg2

connection = psycopg2.connect(
              host=os.environ["POSTGRES_HOST"],
              port=os.environ["POSTGRES_PORT"],
              dbname=os.environ["POSTGRES_DB"],
              user=os.environ["POSTGRES_USER"],
              password=os.environ["POSTGRES_PASSWORD"],
          )
          connection.close()
          print("PostgreSQL is ready")
          PY
            exit 0
          done

echo "::error::PostgreSQL did not become ready in time"
          exit 1

- name: Generate test data
        run: |
          python data/sample/generate_mock_data.py

- name: Run tests
        run: |
          if [ ! -d tests ]; then
            echo "::error::The tests directory does not exist."
            exit 1
          fi

python -m pytest tests \
            -q \
            --disable-warnings \
            --maxfail=1 \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80

- name: Run ingestion smoke test
        run: |
          python -m src.ingestion.postgres_reader

- name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

