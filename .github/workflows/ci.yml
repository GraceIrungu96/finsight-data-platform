name: FinSight CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: finsight_db
          POSTGRES_USER: finsight_user
          POSTGRES_PASSWORD: finsight_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic psycopg2-binary great-expectations pytest ruff

      - name: Run Linter (Ruff)
        run: |
          ruff check src/

      - name: Run Ingestion & Data Quality Tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5433
          POSTGRES_DB: finsight_db
          POSTGRES_USER: finsight_user
          POSTGRES_PASSWORD: finsight_password
        run: |
          python3 data/sample/generate_mock_data.py
          python3 -m src.ingestion.postgres_reader
